name: CI

on:
  push:
    branches:
      - "master"
  pull_request:

# Set the default shell on all platforms.
defaults:
  run:
    shell: sh

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: |
      ${{ format(
            'Test on {0}{1}{2}',
            startsWith(matrix.os, 'ubuntu-') && 'Linux' || startsWith(matrix.os, 'macOS-') && 'macOS' || startsWith(matrix.os, 'windows-') && 'Windows',
            matrix.ghc-version && format(' with GHC {0}', matrix.ghc-version),
            matrix.cabal-flags && format(' with {0}', matrix.cabal-flags)
          )
       }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🛠️ Setup Haskell
        id: setup-haskell
        uses: haskell-actions/setup@v2.12.1
        with:
          ghc-version: ${{ matrix.ghc-version }}

      - name: 🗄️ Generate Cabal plan
        run: cabal build all ${{ matrix.cabal-flags }} --dry-run

      - name: 💾 Restore Cabal dependencies
        uses: actions/cache/restore@v6
        id: cache-cabal
        env:
          key: build-${{ runner.os }}-ghc-${{ steps.setup-haskell.outputs.ghc-version }}-cabal-${{ steps.setup-haskell.outputs.cabal-version }}-flags-${{ matrix.cabal-flags }}
        with:
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          key: ${{ env.key }}-plan-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: ${{ env.key }}-

      - name: 🛠️ Build Cabal dependencies
        run: cabal build all --enable-tests ${{ matrix.cabal-flags }} --only-dependencies

      - name: 💾 Save Cabal dependencies
        uses: actions/cache/save@v6
        if: ${{ steps.cache-cabal.outputs.cache-hit != 'true' }}
        with:
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          key: ${{ steps.cache-cabal.outputs.cache-primary-key }}

      - name: 🏗️ Build
        run: cabal build all --enable-tests ${{ matrix.cabal-flags }}

      - name: 🚀 Testing
        run: cabal test all ${{ matrix.cabal-flags }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-latest"
        ghc-version:
          - "9.6.7"
          - "9.8.4"
          - "9.10.3"
          - "9.12.4"
          - "9.14.1"
        cabal-flags:
          - "--flags=+small-loop-counter"
        include:
          - os: "ubuntu-latest"
            ghc-version: "9.10.3"
            cabal-flags: ""
          - os: "macOS-latest"
            ghc-version: "9.10.3"
            cabal-flags: "--flags=+small-loop-counter"
          - os: "windows-latest"
            ghc-version: "9.10.3"
            cabal-flags: "--flags=+small-loop-counter"
